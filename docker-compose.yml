services:
  singularity-web:
    image: nginx:alpine
    container_name: singularity-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - npm

  # online Hall of Fame for V3 (Python stdlib + SQLite in ./scores/data)
  singularity-scores:
    image: python:3-alpine
    container_name: singularity-scores
    restart: unless-stopped
    command: python /app/server.py
    volumes:
      - ./scores/server.py:/app/server.py:ro
      - ./scores/data:/data
    networks:
      - npm

networks:
  npm:
    external: true
    # Name of the network Nginx Proxy Manager runs in (docker network ls)
    name: nginx-proxy_default
