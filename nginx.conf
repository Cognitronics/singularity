server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # high-score service (scores/server.py). Resolved at request time, so the site
    # still starts if the score container is down.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $scores http://singularity-scores:8080;
        proxy_pass $scores;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 4k;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
